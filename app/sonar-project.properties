# Configuración de SonarQube Cloud para la app móvil UTrueque (Flutter/Dart).
# El análisis se ejecuta desde GitHub Actions con projectBaseDir = app/.
# Ver docs/Plan_de_Pruebas.md, Sección 3 (Quality Gate).

sonar.organization=angel050019
sonar.projectKey=Angel050019_UTrueque-DevOps
sonar.projectName=UTrueque
sonar.projectVersion=0.1.0

sonar.sources=lib
sonar.tests=test
sonar.sourceEncoding=UTF-8

# Reporte de cobertura generado por `flutter test --coverage`
sonar.dart.lcov.reportPaths=coverage/lcov.info

# Archivos generados (por si algún día se usa build_runner); no se analizan.
sonar.exclusions=**/*.g.dart,**/*.freezed.dart

# Las pantallas, widgets visuales, tema y rutas se validan con pruebas de
# widgets / integración (Unidad III); no cuentan para la cobertura de pruebas
# unitarias. Los Cubits, casos de uso, datos y utilidades SÍ cuentan.
sonar.coverage.exclusions=lib/main.dart,lib/**/presentation/pages/**,lib/**/presentation/widgets/**,lib/core/widgets/**,lib/core/theme/**,lib/core/routes/**

# El paso de CI espera el resultado del Quality Gate y falla si no pasa.
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300
