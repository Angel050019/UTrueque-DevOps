# Configuración de SonarQube Cloud para la app móvil UTrueque (Flutter/Dart).
# El análisis se ejecuta desde GitHub Actions con projectBaseDir = app/.
# Ver docs/Plan_de_Pruebas.md, Sección 3 (Quality Gate).

sonar.organization=angel050019
sonar.projectKey=Angel050019_UTrueque-DevOps
sonar.projectName=UTrueque
sonar.projectVersion=0.1.0

sonar.sources=lib
sonar.tests=test
sonar.sourceEncoding=UTF-8

# Reporte de cobertura generado por `flutter test --coverage`
sonar.dart.lcov.reportPaths=coverage/lcov.info

# Las pantallas, widgets visuales y rutas se validan con pruebas de widgets /
# integración (Unidad III); no cuentan para la cobertura de pruebas unitarias.
sonar.coverage.exclusions=lib/main.dart,lib/**/presentation/pages/**,lib/core/widgets/**,lib/core/routes/**

# El paso de CI espera el resultado del Quality Gate y falla si no pasa.
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300
