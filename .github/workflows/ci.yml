name: UTrueque CI Pipeline

on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ main, develop ]
  # Permite lanzar el pipeline a mano (botón "Run workflow" en GitHub o el
  # botón "Lanzar pipeline" del agente en tools/agente-pipeline/).
  workflow_dispatch:

# Si llega un push nuevo al mismo PR, se cancela la corrida anterior.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # El id "validate" es el nombre del check obligatorio en la protección de ramas.
  validate:
    runs-on: ubuntu-latest
    env:
      # Solo se expone "true"/"false"; el token en sí solo llega al paso de SonarQube.
      TIENE_SONAR: ${{ secrets.SONAR_TOKEN != '' }}
      # Plan Free de SonarQube Cloud: solo analiza la rama principal del proyecto
      # y los PR que apuntan a ella. En SonarQube Cloud la rama principal se
      # renombró a "develop" (ver docs/Plan_de_Pruebas.md, sección 3.3).
      SONAR_RAMA_PRINCIPAL: develop
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v5
        with:
          # SonarQube necesita el historial completo para detectar "código nuevo"
          fetch-depth: 0

      - name: Verify Repository Structure
        run: |
          echo "Verificando estructura de carpetas..."
          test -d docs || exit 1
          test -d app || exit 1
          test -f app/pubspec.yaml || exit 1
          echo "Estructura base verificada correctamente."

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Instalar dependencias
        working-directory: app
        run: flutter pub get

      - name: Análisis estático (flutter analyze)
        working-directory: app
        run: |
          # Si hay problemas, se publican como anotaciones en el PR (archivo y línea).
          if ! flutter analyze > analyze.txt 2>&1; then
            cat analyze.txt
            awk -F ' • ' '/^ *(info|warning|error) • /{ split($3, u, ":"); printf "::error file=app/%s,line=%s::%s (%s)\n", u[1], u[2], $2, $4 }' analyze.txt
            exit 1
          fi
          cat analyze.txt

      - name: Pruebas unitarias y del API REST (patrón AAA) con cobertura
        working-directory: app
        run: flutter test --coverage --reporter expanded

      - name: Quality Gate local - cobertura >= 80% en dominio y datos
        working-directory: app
        run: bash ../.github/scripts/quality_gate_cobertura.sh coverage/lcov.info 80

      - name: Publicar reporte de cobertura
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: cobertura-lcov
          path: app/coverage/lcov.info
          if-no-files-found: ignore

      - name: ¿Corre SonarQube en este evento?
        id: sonar
        run: |
          RAMA="${{ github.base_ref || github.ref_name }}"
          if [ "$TIENE_SONAR" != "true" ]; then
            echo "::warning::Falta el secreto SONAR_TOKEN. Se omitió el análisis de SonarQube Cloud (ver docs/Plan_de_Pruebas.md, sección 3.3)."
            echo "correr=false" >> "$GITHUB_OUTPUT"
          elif [ "$RAMA" != "$SONAR_RAMA_PRINCIPAL" ]; then
            echo "::notice::SonarQube Cloud (plan Free) solo analiza '$SONAR_RAMA_PRINCIPAL' y los PR hacia ella. Se omite para '$RAMA'."
            echo "correr=false" >> "$GITHUB_OUTPUT"
          else
            echo "correr=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Análisis SonarQube Cloud + Quality Gate
        if: steps.sonar.outputs.correr == 'true'
        uses: SonarSource/sonarqube-scan-action@v7
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          projectBaseDir: app
