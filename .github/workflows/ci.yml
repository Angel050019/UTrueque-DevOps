name: UTrueque CI Pipeline

on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ main, develop ]
  # Permite lanzar el pipeline a mano
  workflow_dispatch:

# Si llega un push nuevo al mismo PR, se cancela la corrida anterior.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    env:
      TIENE_SONAR: ${{ secrets.SONAR_TOKEN != '' }}
      SONAR_RAMA_PRINCIPAL: develop

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v5
        with:
          fetch-depth: 0 # Necesario para SonarQube (historial completo)

      - name: Verify Repository Structure
        run: |
          echo "Verificando estructura de carpetas..."
          test -d docs || exit 1
          test -d app || exit 1
          test -f app/pubspec.yaml || exit 1
          echo "Estructura base verificada correctamente."

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Instalar dependencias
        working-directory: app
        run: flutter pub get

      - name: Análisis estático (flutter analyze)
        working-directory: app
        run: |
          if ! flutter analyze > analyze.txt 2>&1; then
            cat analyze.txt
            awk -F ' • ' '/^ *(info|warning|error) • /{ split($3, u, ":"); printf "::error file=app/%s,line=%s::%s (%s)\n", u[1], u[2], $2, $4 }' analyze.txt
            exit 1
          fi
          cat analyze.txt

      - name: Pruebas unitarias y del API REST con cobertura
        working-directory: app
        run: flutter test --coverage --reporter expanded

      - name: Quality Gate local - cobertura >= 80% en dominio y datos
        working-directory: app
        run: bash ../.github/scripts/quality_gate_cobertura.sh coverage/lcov.info 80

      - name: Publicar reporte de cobertura
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: cobertura-lcov
          path: app/coverage/lcov.info
          if-no-files-found: ignore

      - name: ¿Corre SonarQube en este evento?
        id: sonar
        run: |
          RAMA="${{ github.base_ref || github.ref_name }}"
          if [ "$TIENE_SONAR" != "true" ]; then
            echo "::warning::Falta el secreto SONAR_TOKEN. Se omitió el análisis de SonarQube Cloud."
            echo "correr=false" >> "$GITHUB_OUTPUT"
          elif [ "$RAMA" != "$SONAR_RAMA_PRINCIPAL" ]; then
            echo "::notice::SonarQube Cloud (plan Free) solo analiza '$SONAR_RAMA_PRINCIPAL' y los PR hacia ella. Se omite para '$RAMA'."
            echo "correr=false" >> "$GITHUB_OUTPUT"
          else
            echo "correr=true" >> "$GITHUB_OUTPUT"
          fi

      # -------------------------------------------------------------
      # 1. REQUERIMIENTO 1: Análisis e Integración con SonarQube Cloud
      # -------------------------------------------------------------
      - name: Análisis SonarQube Cloud + Quality Gate
        if: steps.sonar.outputs.correr == 'true'
        uses: SonarSource/sonarqube-scan-action@v7
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          projectBaseDir: app
          args: >
            -Dsonar.organization=${{ secrets.SONAR_ORGANIZATION }}
            -Dsonar.projectKey=${{ secrets.SONAR_PROJECT_KEY }}
            -Dsonar.dart.lcov.reportPaths=coverage/lcov.info

      # -------------------------------------------------------------
      # 2. REQUERIMIENTO 2: Notificación por Correo Electrónico al Fallar
      # -------------------------------------------------------------
      - name: Enviar correo de notificación tras fallo
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "🚨 [CI FAILURE] Falló el pipeline en ${{ github.repository }} (${{ github.ref_name }})"
          to: ${{ secrets.MAIL_RECIPIENTS }}
          from: "GitHub CI Bot <${{ secrets.MAIL_USERNAME }}>"
          html_body: |
            <h2>🚨 El pipeline de CI ha fallado en <strong>UTrueque</strong></h2>
            <p>Se detectó un fallo durante la ejecución de las pruebas o análisis estático.</p>
            <ul>
              <li><strong>Repositorio:</strong> ${{ github.repository }}</li>
              <li><strong>Rama / Ref:</strong> ${{ github.ref_name }}</li>
              <li><strong>Autor:</strong> ${{ github.actor }}</li>
              <li><strong>Commit:</strong> ${{ github.sha }}</li>
            </ul>
            <p>
              <a href="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" 
                 style="background-color: #d9534f; color: white; padding: 10px 15px; text-decoration: none; border-radius: 5px;">
                 Ver logs detallados en GitHub Actions
              </a>
            </p>
